<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Panel administrativo</title>
        <link rel="stylesheet" th:href="@{/style/style.css}">
        <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    </head>
<body th:style="'background-color: ' + ${colorFondo} + '; min-height: 100vh; margin:0; padding:2rem;'">

<h1 th:text="${tipo == 'museo' ? 'Panel del museo' : 'Panel del equipo'}"></h1>

<form th:action="@{/salir}" method="post">
    <button type="submit">Salir</button>
</form>


 
<h1>ArqeaDB</h1>
 
<div class="toggle-grupo">
    <button class="toggle-btn activo" data-target="tabla-artefactos" onclick="mostrarTabla(this)">Artefactos</button>
    <button class="toggle-btn" data-target="tabla-lideres" onclick="mostrarTabla(this)">Lideres</button>
    <button class="toggle-btn" data-target="tabla-equipos" onclick="mostrarTabla(this)">Equipos</button>
    <button class="toggle-btn" data-target="tabla-clases" onclick="mostrarTabla(this)">Clases</button>
    <button class="toggle-btn" data-target="tabla-museos" onclick="mostrarTabla(this)">Museos</button>
    <button class="toggle-btn" data-target="tabla-yacimientos" onclick="mostrarTabla(this)">Yacimientos</button>
</div>
 
<!-- Artefactos -->
    <a th:href="@{/artefactos/nuevo}">+ Nuevo artefacto</a>
<div id="tabla-artefactos" class="tabla-seccion activo">
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Descubridores</th>
            <th>Yacimiento</th>
            <th>Museo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="art : ${artefactos}"  th:attr="onclick=|mostrarImagen('${art.img}'); Toggle(this)|">
            <td th:text="${art.nombre}"></td>
            <td th:text="${art.descripcion}"></td>
            <td th:text="${art.descubridores}"></td>
            <td th:text="${art.yacimiento}"></td>
            <td th:text="${art.museo}"></td>
            <td>
                <button th:attr="onclick=|pedirClave('artefacto', ${art.idArtefacto}, 'editar')|">Editar</button>
                <button th:attr="onclick=|pedirClave('artefacto', ${art.idArtefacto}, 'eliminar')|">Eliminar</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Lideres -->
<div id="tabla-lideres" class="tabla-seccion">
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${lideres}">
            <td th:text="${l.nombre}"></td>
            <td th:text="${l.apellido}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Equipos -->
<div id="tabla-equipos" class="tabla-seccion">
    <table>
        <thead>
        <tr>
            <th>Nombre del equipo</th>
            <th>Lider</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equi : ${equipos}">
            <td th:text="${equi.nombreEquipo}"></td>
            <td th:text="${equi.lider}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Clases -->
<div id="tabla-clases" class="tabla-seccion">
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clases}">
            <td th:text="${c.nombreClase}"></td>
            <td th:text="${c.descripcionClase}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Museos -->
<div id="tabla-museos" class="tabla-seccion">
    <table>
        <thead>
        <tr>
            <th>Nombre del museo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${museos}">
            <td th:text="${m.nombreMuseo}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Yacimientos -->
<div id="tabla-yacimientos" class="tabla-seccion">
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Latitud</th>
            <th>Longitud</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="y : ${yacimientos}">
            <td th:text="${y.nombre}"></td>
            <td th:text="${y.latitud}"></td>
            <td th:text="${y.longitud}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<div id="modal-clave-accion" class="modal-overlay">
    <div class="modal-caja">
        <h3>Ingresa el código para continuar</h3>
        <form th:action="@{/verificar-clave}" method="post">
            <input type="hidden" name="tipo" id="clave-tipo"/>
            <input type="hidden" name="id" id="clave-id"/>
            <input type="hidden" name="accion" id="clave-accion"/>

            <input type="text" name="clave" placeholder="Código" maxlength="12" required/>
            <button type="submit">Confirmar</button>
            <button type="button" onclick="cerrarModalClave()">Cancelar</button>
        </form>
        <p th:if="${errorClave}" th:text="${errorClave}" style="color:red;"></p>
    </div>
</div>

<div id="imagen">
    <img id="imagen-preview" src="/img/sin-imagen.png" alt="Vista previa" width="300" height="300"/>
</div>

<script th:src="@{/script/script.js}"></script>
<script th:if="${errorClave}" th:inline="javascript">
    window.addEventListener('DOMContentLoaded', function() {
        pedirClave('[[${tipoReintento}]]', '[[${idReintento}]]', '[[${accionReintento}]]');
    });
</script>

</body>
</html>
