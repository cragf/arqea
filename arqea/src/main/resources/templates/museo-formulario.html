<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Museo</title>
        <link rel="stylesheet" th:href="@{/style/style.css}">
        <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>

<h1>Museo</h1>

<form th:action="@{/museos/guardar}" th:object="${museo}" method="post">

    <input type="hidden" th:field="*{idMuseo}"/>
    <input type="hidden" th:field="*{habilitado}"/>
    
    <label>Nombre</label>
    <input type="text" th:field="*{nombreMuseo}"/><br/>

    <div th:if="${museo.idMuseo == null}">
    </div>

    <button type="submit">Guardar</button>
    <a th:href="@{/}">Cancelar</a>
</form>

</body>
</html>
