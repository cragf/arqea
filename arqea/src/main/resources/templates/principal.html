<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/style/style.css}">
        <link rel="icon" type="image/x-icon" href="img/favicon.ico">
        <title>Arqea</title>
    </head>
<body>
    
<h1>ArqeaDB</h1>
 
<div class="toggle-grupo">
    <button class="toggle-btn activo" data-target="tabla-artefactos" onclick="mostrarTabla(this)">Artefactos</button>
    <button class="toggle-btn" data-target="tabla-lideres" onclick="mostrarTabla(this)">Lideres</button>
    <button class="toggle-btn" data-target="tabla-equipos" onclick="mostrarTabla(this)">Equipos</button>
    <button class="toggle-btn" data-target="tabla-clases" onclick="mostrarTabla(this)">Clases</button>
    <button class="toggle-btn" data-target="tabla-museos" onclick="mostrarTabla(this)">Museos</button>
    <button class="toggle-btn" data-target="tabla-yacimientos" onclick="mostrarTabla(this)">Yacimientos</button>
</div>
<div id="mapa" style="height:500px; margin-top:2rem; border-radius:8px;">
    
</div>
 
<!-- Artefactos -->
<div id="tabla-artefactos" class="tabla-seccion activo">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre</option>
            <option value="1">Descripción</option>
            <option value="2">Descubridores</option>
            <option value="3">Yacimiento</option>
            <option value="4">Museo</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Descubridores</th>
            <th>Yacimiento</th>
            <th>Museo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="art : ${artefactos}"  th:attr="onclick=|mostrarImagen('${art.img}'); Toggle(this)|">
            <td th:text="${art.nombre}"></td>
            <td th:text="${art.descripcion}"></td>
            <td th:text="${art.descubridores}"></td>
            <td th:text="${art.yacimiento}"></td>
            <td th:text="${art.museo}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Lideres -->
<div id="tabla-lideres" class="tabla-seccion">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre</option>
            <option value="1">Apellido</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${lideres}">
            <td th:text="${l.nombre}"></td>
            <td th:text="${l.apellido}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Equipos -->
<div id="tabla-equipos" class="tabla-seccion">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre del equipo</option>
            <option value="1">Lider</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre del equipo</th>
            <th>Lider</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equi : ${equipos}">
            <td th:text="${equi.nombreEquipo}"></td>
            <td th:text="${equi.lider}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Clases -->
<div id="tabla-clases" class="tabla-seccion">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre</option>
            <option value="1">Descripción</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clases}">
            <td th:text="${c.nombreClase}"></td>
            <td th:text="${c.descripcionClase}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Museos -->
<div id="tabla-museos" class="tabla-seccion">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre del museo</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre del museo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${museos}">
            <td th:text="${m.nombreMuseo}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<!-- Yacimientos -->
<div id="tabla-yacimientos" class="tabla-seccion">
    <div class="busqueda-barra">
        <select class="busqueda-columna" onchange="filtrarTabla(this)">
            <option value="0">Nombre</option>
            <option value="1">Latitud</option>
            <option value="2">Longitud</option>
        </select>
        <input type="text" class="busqueda-texto" placeholder="Buscar..." oninput="filtrarTabla(this)"/>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Latitud</th>
            <th>Longitud</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="y : ${yacimientos}">
            <td th:text="${y.nombre}"></td>
            <td th:text="${y.latitud}"></td>
            <td th:text="${y.longitud}"></td>
        </tr>
        </tbody>
    </table>
</div>
 
<div id="imagen">
    <img id="imagen-preview" src="/img/00001.webp" alt="Vista previa" width="300" height="300"/>
</div>
<button id="btn-entrar" onclick="document.getElementById('modal-clave').style.display='flex'">Entrar</button>

<div id="modal-clave" class="modal-overlay">
    <div class="modal-caja">
        <h3>Ingresar</h3>
        <form th:action="@{/ingresar}" method="post">
            <input type="text" name="clave" placeholder="Clave" maxlength="12" required/>
            <button type="submit">Entrar</button>
            <button type="button" onclick="document.getElementById('modal-clave').style.display='none'">Cancelar</button>
        </form>
        <p th:if="${error}" th:text="${error}" style="color:red;"></p>
    </div>
</div>

<!-- Pop up con la clave que va a aparecer en la db -->
<div id="modal-clave-generada" class="modal-overlay">
    <div class="modal-caja">
        <h3>Registro creado</h3>
        <p>Guarda este código, lo vas a necesitar para editar o eliminar este registro más adelante:</p>
        <p th:text="${claveGenerada}" style="font-size:1.5rem; font-weight:bold; letter-spacing:0.1em;"></p>
        <button type="button" onclick="document.getElementById('modal-clave-generada').style.display='none'">Entendido</button>
    </div>
</div>

<script th:if="${claveGenerada}">
    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('modal-clave-generada').style.display = 'flex';
    });
</script>
<script th:src="@{/script/script.js}"></script>
 
</body>
</html>
